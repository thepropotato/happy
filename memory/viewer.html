<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Happy — log</title>
    <style>
      __STYLE__
    </style>
  </head>
  <body>
    <!-- THE LOG SITS IN THE PAGE AND NOT BESIDE IT: A file:// PAGE IS NOT ALLOWED
         TO FETCH ITS OWN SIBLING. data/happy.log IS THE SAME THING AND IS THE ONE
         TO READ FROM A TERMINAL. -->
    <script id="logs" type="application/json">
      __LOGS__
    </script>

    <div class="sheet">
      <header>
        <h1>Happy <span>log</span></h1>
        <p class="about" id="about"></p>
        <div class="tools">
          <input id="find" type="search" placeholder="Search the log…" />
          <button id="quiet">Only what went wrong</button>
          <button id="foot">Latest</button>
        </div>
      </header>
      <div class="log" id="log"></div>
    </div>

    <script>
      const LOGS = JSON.parse(document.getElementById('logs').textContent)

      const node = (id) => document.getElementById(id)

      // 12:04:51.882  tool  read_screen 412ms — checking what is on the screen
      const LINE = /^(\d\d:\d\d:\d\d\.\d\d\d)\s+(\S+)\s*(.*)$/

      // WHAT IS WORTH SEEING WHEN SOMEBODY IS ONLY LOOKING FOR THE FAULT. THE RUN
      // LINES STAY IN: WHICH RUN IT WENT WRONG IN IS HALF OF WHAT IS BEING ASKED.
      const WRONG = new Set(['error', 'no', 'run'])

      const KINDS = ['run', 'note', 'error', 'you', 'happy', 'tool', 'no', 'spent']

      let wanted = ''
      let quiet = false

      function make(tag, look, words) {
        const made = document.createElement(tag)

        if (look) made.className = look
        if (words !== undefined) made.textContent = words

        return made
      }

      // A LINE THE LOG WROTE, PULLED BACK APART. ANYTHING THAT DOES NOT PARSE IS
      // STILL SHOWN — SOMETHING ELSE WROTE IT, AND THAT IS WORTH SEEING TOO.
      function parsed(text) {
        const found = LINE.exec(text)

        if (!found) return { at: '', kind: '', words: text, raw: text }

        return { at: found[1], kind: found[2], words: found[3], raw: text }
      }

      const LINES = (LOGS.lines || []).map(parsed)

      function matching() {
        const kept = quiet ? LINES.filter((line) => WRONG.has(line.kind)) : LINES

        if (!wanted) return kept

        return kept.filter((line) => line.raw.toLowerCase().includes(wanted))
      }

      function drawn(line, before) {
        const known = KINDS.includes(line.kind) ? line.kind : 'other'
        const same = before && before.at === line.at
        const row = make('div', `line ${known}${same ? ' same' : ''}`)

        row.append(make('span', 'at', line.at))
        row.append(make('span', 'kind', line.kind))
        row.append(make('span', 'words', line.words))

        return row
      }

      function paint() {
        const found = matching()
        const holder = node('log')

        holder.replaceChildren()

        if (!found.length) {
          holder.append(make('p', 'empty', LINES.length ? 'Nothing here matches that.' : 'The log is empty. Run Happy and it fills up.'))
        } else {
          let before = null

          for (const line of found) {
            holder.append(drawn(line, before))
            before = line
          }
        }

        node('about').textContent = about(found)
        node('quiet').classList.toggle('on', quiet)
      }

      function about(found) {
        const shown = found.length === LINES.length ? `${LINES.length} lines` : `${found.length} of ${LINES.length} lines`

        return `${shown} · written ${LOGS.written} · ${LOGS.file}`
      }

      node('find').oninput = (event) => {
        wanted = event.target.value.trim().toLowerCase()
        paint()
      }

      node('quiet').onclick = () => {
        quiet = !quiet
        paint()
      }

      // A LOG IS READ FROM THE BOTTOM. IT IS A BUTTON AND NOT WHERE THE PAGE OPENS,
      // BECAUSE A PAGE THAT JUMPS ON ITS OWN LOSES WHOEVER WAS ALREADY READING.
      node('foot').onclick = () => scrollTo({ top: document.body.scrollHeight })

      paint()
    </script>
  </body>
</html>
