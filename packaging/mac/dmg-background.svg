<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- THE WINDOW THE DMG OPENS IN. Happy.app SITS AT (170, 190) AND Applications AT (470, 190), AS build.sh PLACES THEM. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFCFA"/>
      <stop offset="1" stop-color="#EEF2EC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.47" r="0.62">
      <stop offset="0" stop-color="#658761" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#658761" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#ground)"/>
  <rect width="640" height="400" fill="url(#glow)"/>

  <!-- THE ARROW FROM HAPPY TO APPLICATIONS, LEVEL WITH THE MIDDLE OF THE ICONS. -->
  <g fill="none" stroke="#658761" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M268 188 C 300 168, 340 168, 372 188"/>
    <path d="M356 172 L 373 189 L 351 195"/>
  </g>

  <text x="320" y="338" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" fill="#3F4A3D">Drag Happy into Applications</text>
  <text x="320" y="360" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="12" fill="#7A8578">then open him from there</text>
</svg>
