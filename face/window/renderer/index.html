<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:" />
    <title>Happy</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="stream.css" />
    <link rel="stylesheet" href="controls.css" />
    <link rel="stylesheet" href="fields.css" />
    <link rel="stylesheet" href="services.css" />
    <link rel="stylesheet" href="drawer.css" />
  </head>

  <body>
    <div class="glass" id="glass">
      <canvas class="aurora" id="aurora"></canvas>

      <header class="bar">
        <!-- THE SAME ORB, SHRUNK, ONCE THERE ARE WORDS THAT WANT THE ROOM. IT IS THE
             ONLY MARK UP HERE: A DOT BESIDE IT SAID THE SAME THING WITH NONE OF THE LIFE. -->
        <canvas class="puck" id="puck" width="120" height="120" title="Show Happy"></canvas>

        <!-- WHAT HE IS DOING IS NOT UP HERE: IT BELONGS AT THE FOOT OF THE
             EXCHANGE, WHERE THE READER IS ALREADY LOOKING. -->
        <span class="name">Happy</span>
        <span class="spacer"></span>

        <span class="icons">
          <button class="icon" id="controls" title="Controls">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-9M8 20H3" />
              <path d="M14 2v4M8 10v4M12 18v4" />
            </svg>
          </button>
          <button class="icon" id="pin" title="Keep open">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 17v5" />
              <path d="M9 10.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.8a2 2 0 0 0-1.1-1.8l-1.8-.9A2 2 0 0 1 15 10.8V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
            </svg>
          </button>
          <!-- PUTS THE PANEL AWAY, NEVER HAPPY: HE IS STILL LISTENING WITH IT SHUT.
               QUITTING IS IN THE MENU BAR ICON. -->
          <button class="icon" id="tuck" title="Minimize">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M5 12h14" />
            </svg>
          </button>
        </span>
      </header>

      <!-- THE ONE THING THAT IS WRONG, AND THE BUTTON THAT FIXES IT. -->
      <div class="amiss" id="amiss" hidden>
        <span class="words" id="amisswords"></span>
        <button class="fix" id="amissfix">Allow</button>
      </div>

      <section class="hero" id="hero">
        <canvas class="orb" id="orb" width="440" height="440" title="Tuck Happy into the corner"></canvas>
        <div class="mood" id="mood">waking up</div>
        <div class="hint" id="hint">loading</div>
      </section>

      <main class="panes">
        <div class="stream" id="stream"></div>

        <form class="composer" id="composer">
          <input id="typed" type="text" placeholder="Type to Happy" autocomplete="off" />
          <button class="send" id="send" type="submit" aria-label="Send">↵</button>
          <button class="pause" id="pause" type="button" aria-label="Pause">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="7" y="7" width="10" height="10" rx="1.5" />
            </svg>
          </button>
        </form>
      </main>

      <!-- THE CONTROLS ARE THE WHOLE PANEL. NOTHING ELSE TO READ PAST. -->
      <section class="screen" id="screen">
        <header class="bar">
          <button class="icon" id="back" title="Back to Happy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <span class="name">Controls</span>
          <span class="spacer"></span>
          <span class="sub">Everything Happy is set to</span>
        </header>

        <div class="rows" id="rows"></div>
      </section>

      <div class="asking" id="asking" hidden>
        <div class="card">
          <div class="why" id="why"></div>
          <div class="what" id="what"></div>
          <div class="buttons">
            <button class="no" id="no">No</button>
            <button class="yes" id="yes">Allow</button>
          </div>
        </div>
      </div>
    </div>

    <script src="parts.js"></script>
    <script src="marks.js"></script>
    <script src="aurora.js"></script>
    <script src="orb.js"></script>
    <script src="talk.js"></script>
    <script src="fields.js"></script>
    <script src="services.js"></script>
    <script src="knobs.js"></script>
    <script src="app.js"></script>
  </body>
</html>
