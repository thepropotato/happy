name: Bug report
description: Something Happy did wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do **not** go here — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you said or did, and what Happy did instead of the right thing.
      placeholder: I held the key and said "open downloads", and it read the path out loud instead of opening it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: Every step, from a cold start if that matters.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Both
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OS version and Python version
      placeholder: macOS 15.2, Python 3.13.1
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD`"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: What the terminal printed
      description: The runtime log — what Happy printed to the terminal around the moment it went wrong.
      render: shell
